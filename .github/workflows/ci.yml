name: CI

# Filet anti-régression : lance les tests backend + le build front à chaque
# push sur main et sur chaque pull request. Objectif : ne jamais déployer du
# code qui casse les tests ou ne compile pas.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Tests backend (Django + pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: procura
          POSTGRES_PASSWORD: procura
          POSTGRES_DB: procura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: 'True'
      SECRET_KEY: ci-test-secret-key-not-for-production
      DISABLE_REDIS_CACHE: 'true'
      DATABASE_URL: postgres://procura:procura@localhost:5432/procura_test
      MISTRAL_API_KEY: ''
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Dépendances système (WeasyPrint / cairo / pango / reportlab)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libcairo2 libcairo2-dev libffi-dev gettext \
            python3-dev libfreetype6-dev libjpeg-dev zlib1g-dev pkg-config

      - name: Installer les dépendances Python
        run: |
          set +e
          python -m pip install --upgrade pip
          pip install -r requirements.txt > /tmp/pip_out.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::group::pip install - sortie complete"
            cat /tmp/pip_out.log
            echo "::endgroup::"
            # Emet les dernieres lignes comme annotations : visibles via
            # l'API publique meme sans acces aux logs bruts (diagnostic).
            tail -n 60 /tmp/pip_out.log | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g' | tr -d '\r')
              echo "::error::$esc"
            done
            exit 1
          fi
          pip install pytest pytest-django pytest-asyncio

      - name: Lancer les tests (hors intégration + pixtral)
        run: |
          pytest -q -m "not integration" \
            --ignore=apps/ai_assistant/tests/test_pixtral.py

  frontend:
    name: Build frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build de production
        run: npm run build
