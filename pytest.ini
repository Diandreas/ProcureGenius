[pytest]
DJANGO_SETTINGS_MODULE = saas_procurement.settings
python_files = test_*.py tests.py *_tests.py
# Les tests asynchrones (handlers IA) utilisent @pytest.mark.asyncio.
asyncio_mode = auto
# Exclusions de collecte :
#  - test_multi_items.py : script de démo autonome (django.setup()/__main__),
#    pas un vrai test pytest — accède à la base sans le marqueur django_db.
addopts = --ignore=apps/invoicing/test_multi_items.py
markers =
    integration: tests d'intégration nécessitant des services externes (LLM Mistral, etc.)
filterwarnings =
    ignore::DeprecationWarning
